{% extends "base.html" %}
{% block title %}{{ t('otp_title') }} - صلحلي{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon">🔢</div>
            <h3 class="mb-1">{{ t('otp_title') }}</h3>
            <p class="mb-0" style="color:rgba(255,255,255,.8)">{{ t('otp_desc') }}</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control otp-input" maxlength="6" pattern="\d{6}" inputmode="numeric" placeholder="000000" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('otp_btn') }}</button>
            </form>
            <p class="text-center mt-4 mb-0 small" style="font-weight:600">
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none" style="color:var(--blue-600)">{{ t('otp_resend') }}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

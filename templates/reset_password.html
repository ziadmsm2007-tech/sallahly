{% extends "base.html" %}
{% block title %}{{ t('reset_title') }} - صلحلي{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon">🛡️</div>
            <h3 class="mb-1">{{ t('reset_title') }}</h3>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">{{ t('reset_new_pass') }}</label>
                    <div class="input-icon-wrap">
                        <span class="lead">🔑</span>
                        <input type="password" name="new_password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('reset_btn') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t('auth_login_title') }} - صلحلي{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon">🔐</div>
            <h3 class="mb-1">{{ t('auth_login_title') }}</h3>
            <p class="mb-0" style="color:rgba(255,255,255,.8)">{{ t('auth_login_sub') }}</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">{{ t('auth_email') }}</label>
                    <div class="input-icon-wrap">
                        <span class="lead">✉️</span>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ t('auth_password') }}</label>
                    <div class="input-icon-wrap">
                        <span class="lead">🔑</span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('auth_login_btn') }}</button>
            </form>
            <div class="d-flex justify-content-between mt-4 small" style="font-weight:600">
                <a href="{{ url_for('register') }}" class="text-decoration-none" style="color:var(--blue-600)">{{ t('auth_no_account') }} {{ t('auth_register_btn') }}</a>
                <a href="{{ url_for('forgot_password') }}" class="text-decoration-none" style="color:var(--warning)">{{ t('auth_forgot') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
